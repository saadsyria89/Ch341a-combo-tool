name: Build Saad Combo Tool

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Base Project Structure
      run: |
        # إنشاء المجلدات الأساسية لمشروع أندرويد مصغر
        mkdir -p app/src/main/java/com/saad/ch341tool
        mkdir -p app/src/main/res/layout

        # 1. إنشاء ملف settings.gradle
        echo "include ':app'" > settings.gradle

        # 2. إنشاء ملف build.gradle الرئيسي للمشروع
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        # 3. إنشاء ملف build.gradle الخاص بمجلد التطبيق (app)
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace "com.saad.ch341tool"
            compileSdk 34
            defaultConfig {
                applicationId "com.saad.ch341tool"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 4. إنشاء ملف الأذونات والـ Manifest المجهز باسمك
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com" package="com.saad.ch341tool">
            <uses-feature android:name="android.hardware.usb.host" />
            <uses-permission android:name="android.permission.USB_PERMISSION" />
            <application android:allowBackup="true" android:label="سعد العكاري - Combo Tool" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. إنشاء واجهة الأزرار activity_main.xml
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://android.com" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center_horizontal" android:padding="24dp" android:background="#F5F5F5">
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="سعد العكاري - Combo Tool" android:textSize="24sp" android:textStyle="bold" android:textColor="#1E88E5" android:layout_marginTop="20dp"/>
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="أداة تشغيل مبرمجة CH341A للفلاشات 24cxx / 25cxx" android:textSize="12sp" android:textColor="#757575" android:layout_marginBottom="30dp"/>
            <TextView android:id="@+id/statusText" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="الحالة: المبرمجة غير متصلة 🔌" android:textSize="16sp" android:gravity="center" android:padding="16dp" android:background="#FFFFEBEE" android:textColor="#C62828" android:layout_marginBottom="24dp"/>
            <Button android:id="@+id/btnConnect" android:layout_width="match_parent" android:layout_height="50dp" android:text="الاتصال بالمبرمجة وفحص الشريحة" android:backgroundTint="#1E88E5" android:textColor="#FFFFFF" android:layout_marginBottom="20dp"/>
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginBottom="16dp">
                <Button android:id="@+id/btnRead" android:layout_width="0dp" android:layout_height="50dp" android:layout_weight="1" android:text="قراءة Read" android:backgroundTint="#4CAF50" android:textColor="#FFFFFF" android:layout_marginEnd="8dp"/>
                <Button android:id="@+id/btnErase" android:layout_width="0dp" android:layout_height="50dp" android:layout_weight="1" android:text="مسح Erase" android:backgroundTint="#F44336" android:textColor="#FFFFFF" android:layout_marginStart="8dp"/>
            </LinearLayout>
            <Button android:id="@+id/btnWrite" android:layout_width="match_parent" android:layout_height="50dp" android:text="كتابة Write" android:backgroundTint="#FF9800" android:textColor="#FFFFFF"/>
        </LinearLayout>
        EOF

        # 6. إنشاء كود الجافا الأساسي MainActivity.java
        cat << 'EOF' > app/src/main/java/com/saad/ch341tool/MainActivity.java
        package com.saad.ch341tool;
        import android.app.Activity;
        import android.content.Context;
        import android.hardware.usb.UsbDevice;
        import android.hardware.usb.UsbManager;
        import android.hardware.usb.UsbDeviceConnection;
        import android.hardware.usb.UsbInterface;
        import android.hardware.usb.UsbEndpoint;
        import android.os.Bundle;
        import android.widget.Button;
        import android.widget.TextView;
        import android.widget.Toast;
        import java.util.HashMap;

        public class MainActivity extends Activity {
            private UsbDeviceConnection connection = null;
            private UsbInterface usbInterface = null;
            private UsbEndpoint endpointIn = null;
            private UsbEndpoint endpointOut = null;
            private boolean isConnected = false;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(getResources().getIdentifier("activity_main", "layout", getPackageName()));

                UsbManager usbManager = (UsbManager) getSystemService(Context.USB_SERVICE);
                TextView statusText = findViewById(getResources().getIdentifier("statusText", "id", getPackageName()));
                Button btnConnect = findViewById(getResources().getIdentifier("btnConnect", "id", getPackageName()));
                Button btnRead = findViewById(getResources().getIdentifier("btnRead", "id", getPackageName()));
                Button btnErase = findViewById(getResources().getIdentifier("btnErase", "id", getPackageName()));
                Button btnWrite = findViewById(getResources().getIdentifier("btnWrite", "id", getPackageName()));

                btnConnect.setOnClickListener(v -> {
                    HashMap<String, UsbDevice> deviceList = usbManager.getDeviceList();
                    UsbDevice ch341Device = null;
                    for (UsbDevice device : deviceList.values()) {
                        if (device.getVendorId() == 6790 && device.getProductId() == 21778) {
                            ch341Device = device;
                            break;
                        }
                    }
                    if (ch341Device != null) {
                        if (!usbManager.hasPermission(ch341Device)) {
                            statusText.setText("الحالة: يرجى إعطاء صلاحية الـ USB ⚠️");
                            return;
                        }
                        connection = usbManager.openDevice(ch341Device);
                        if (connection != null) {
                            usbInterface = ch341Device.getInterface(0);
                            connection.claimInterface(usbInterface, true);
                            for (int i = 0; i < usbInterface.getEndpointCount(); i++) {
                                UsbEndpoint ep = usbInterface.getEndpoint(i);
                                if (ep.getDirection() == 128) endpointIn = ep;
                                else endpointOut = ep;
                            }
                            byte[] initCmd = new byte[]{0x5f, 0x00};
                            connection.bulkTransfer(endpointOut, initCmd, initCmd.length, 500);
                            statusText.setText("الحالة: متصل بمبرمجة CH341A بنجاح ✅");
                            isConnected = true;
                        }
                    } else {
                        statusText.setText("الحالة: المبرمجة غير متصلة 🔌");
                        isConnected = false;
                    }
                });

                btnRead.setOnClickListener(v -> {
                    if (isConnected && connection != null) {
                        byte[] cmd = new byte[]{0x03, 0x00, 0x00, 0x00};
                        connection.bulkTransfer(endpointOut, cmd, cmd.length, 1000);
                        byte[] buffer = new byte;
                        connection.bulkTransfer(endpointIn, buffer, buffer.length, 2000);
                        Toast.makeText(this, "سعد العكاري: تمت القراءة بنجاح!", Toast.LENGTH_SHORT).show();
                    }
                });

                btnErase.setOnClickListener(v -> {
                    if (isConnected && connection != null) {
                        byte[] writeEnable = new byte[]{0x06};
                        connection.bulkTransfer(endpointOut, writeEnable, writeEnable.length, 500);
                        byte[] bulkErase = new byte[]{(byte) 0xC7};
                        connection.bulkTransfer(endpointOut, bulkErase, bulkErase.length, 2000);
                        Toast.makeText(this, "تم مسح الشريحة!", Toast.LENGTH_SHORT).show();
                    }
                });

